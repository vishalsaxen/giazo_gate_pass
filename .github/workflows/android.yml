name: Build Android app

on:
  push:
    branches: [main, claude/android-apk-behwr0]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional Play Store signing key. Add these repository secrets to sign with it:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=debug key (no ANDROID_KEYSTORE_BASE64 secret)" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        id: out
        run: |
          v="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GiaZoGatePass-$v.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/GiaZoGatePass-$v.aab"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          fp=$(keytool -printcert -jarfile "dist/GiaZoGatePass-$v.apk" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          {
            echo "### GiaZo Gate Pass $v"
            echo "Signed with: $SIGNED_WITH"
            echo ""
            echo "Signing certificate SHA-256 (for assetlinks.json): \`$fp\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GiaZoGatePass-${{ steps.out.outputs.version }}
          path: android/dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.out.outputs.version }}
          name: Android app ${{ steps.out.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Install `GiaZoGatePass-${{ steps.out.outputs.version }}.apk` on an Android phone.
            The `.aab` is for the Google Play Store.
            Signed with: ${{ env.SIGNED_WITH }}
            Signing certificate SHA-256: `${{ steps.out.outputs.fingerprint }}`
          files: android/dist/*
